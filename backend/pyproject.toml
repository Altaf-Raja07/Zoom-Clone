[project]
name = "meetly-backend"
version = "0.1.0"
description = "Meetly — a Zoom-style conferencing backend. FastAPI, SQLAlchemy, SQLite."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]



[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# `Depends(...)` in a default is how FastAPI declares dependencies; B008 does not
# apply to that idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated code; its formatting is not worth hand-editing.
"migrations/versions/*" = ["E501", "UP007", "UP035", "B008", "I001"]
